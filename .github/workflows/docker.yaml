name: Docker build, push, sign, and scan

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    tags:
      - "v*"
  pull_request:  # no base filter: stacked PRs target another PR's branch

permissions:
  contents: read

# Cancel superseded PR/branch runs, but never cancel tag runs (they publish).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  docker:
    name: Docker build
    # The whole build runs inside the reusable docker-build.yaml so the GitHub
    # artifact attestations qualify for SLSA Build Level 3 (see its header).
    # This job's checks report as "Docker build / <job>"; the default-branch
    # ruleset's required check references "Docker build / Build". The reusable
    # workflow also has an "Attest" job, which is skipped on PRs and so is not
    # a useful required check.
    #
    # These permissions are the union the reusable workflow's jobs need — a
    # caller cannot grant more than it holds — and each job there narrows to
    # its own subset.
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
      pull-requests: write
      attestations: write
    uses: $/.github/workflows/docker-build.yaml
    # The write tokens are withheld from pull_request runs altogether: no step
    # in the reusable workflow uses them there, and a same-repository PR run
    # (Renovate's action bumps included) executes the PR's own pinned action
    # commits, so the push credentials must not be in its reach at all. The
    # read-only token is what Docker Scout needs, on every event.
    secrets:
      DOCKERHUB_TOKEN: ${{ github.event_name != 'pull_request' && secrets.DOCKERHUB_TOKEN || '' }}
      DOCKERHUB_READ_TOKEN: ${{ secrets.DOCKERHUB_READ_TOKEN }}
      QUAY_TOKEN: ${{ github.event_name != 'pull_request' && secrets.QUAY_TOKEN || '' }}
