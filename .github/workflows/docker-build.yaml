name: Docker build

# Reusable build + attest path for the container image. The buildx build and
# the GitHub artifact attestation generation live together in this reusable
# workflow — in two jobs, `build` and `attest` — so the attestations qualify
# for SLSA Build Level 3: the signed provenance records this workflow file as
# the signer (its job_workflow_ref), which is per-file, not per-job, so the
# split keeps it intact and the calling workflow still cannot influence it
# beyond invoking this workflow. Verifiers can require it:
#
#   gh attestation verify oci://<image> --repo jkreileder/cf-ips-to-hcloud-fw \
#     --signer-workflow jkreileder/cf-ips-to-hcloud-fw/.github/workflows/docker-build.yaml
#
# Triggers and concurrency live in the calling workflow (docker.yaml).
# The secrets are optional so fork PR and Dependabot runs (which have no
# access to them) can still call this workflow; every step that needs them
# is guarded to non-PR, non-Dependabot events.

on:
  workflow_call:
    secrets:
      DOCKERHUB_TOKEN:
        required: false
      QUAY_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      security-events: write
      pull-requests: write

    # The image digest is the only thing the attest job needs from here.
    outputs:
      digest: ${{ steps.build-and-push.outputs.digest }}

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          disable-sudo: true
          egress-policy: block
          # The two d*.cloudfront.net hosts are Docker Scout's vulnerability-data
          # CDN distributions. If Docker rotates them, only the scan steps
          # (continue-on-error) lose access — update the names from the
          # harden-runner insights of the failing run.
          # tmaproduction.blob.core.windows.net is GitHub's attestation-bundle
          # storage that `gh attestation verify` fetches from in the base-image
          # provenance check; if GitHub rotates the storage account, update it
          # from the failing run's harden-runner insights.
          allowed-endpoints: >
            api.dso.docker.com:443
            api.github.com:443
            api.scout.docker.com:443
            auth.docker.io:443
            cdn01.quay.io:443
            cdn02.quay.io:443
            cdn03.quay.io:443
            d2glxqk2uabbnd.cloudfront.net:443
            d5l0dvt14r5h8.cloudfront.net:443
            dl-cdn.alpinelinux.org:443
            docker-images-prod.6aa30f8b08e16409b46e0173d6de2f56.r2.cloudflarestorage.com:443
            files.pythonhosted.org:443
            fulcio.sigstore.dev:443
            get.anchore.io:443
            ghcr.io:443
            github.com:443
            grype.anchore.io:443
            hub.docker.com:443
            index.docker.io:443
            nodejs.org:443
            objects.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            pypi.org:443
            quay.io:443
            raw.githubusercontent.com:443
            registry-1.docker.io:443
            registry.scout.docker.com:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            timestamp.sigstore.dev:443
            tmaproduction.blob.core.windows.net:443
            tuf-repo-cdn.sigstore.dev:443
            uploads.github.com:443

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fail closed when a release tag doesn't match the project version, so a
      # mistaken tag can't publish images whose semver tags (derived from the
      # git tag) disagree with the packaged version, or ship a non-final
      # (.dev/pre-release/local) version. Only meaningful on tag pushes; runs
      # first so a bad tag stops the build before any registry work.
      - name: Verify tag matches project version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^version = "([^"]+)"$/\1/p' pyproject.toml)"
          if [ -z "$version" ]; then
            echo "::error::Could not read version from pyproject.toml"
            exit 1
          fi
          expected="${TAG#v}"
          if [ "$version" != "$expected" ]; then
            echo "::error::Tag $TAG (version '$expected') does not match pyproject.toml version '$version'"
            exit 1
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Refusing to publish non-final version '$version' from tag $TAG"
            exit 1
          fi
          echo "Release version '$version' matches tag $TAG"

      # No global Docker Hub login here on purpose: GitHub-hosted runners ship
      # a rate-limit-free pull token in the default docker config, and an
      # unscoped `docker login` would overwrite it. All Hub pulls — the uv
      # manifest fetches in the verify step below (gh uses the docker
      # keychain), the binfmt/buildkit tooling images, and the base images
      # during the build — ride that embedded token, including on fork PRs and
      # Dependabot runs. Push credentials are scoped to buildx (below), and the
      # unscoped logins that attestation pushes need live in the attest job, on
      # its own runner, where overwriting the embedded token costs nothing.

      # Verify the uv base images carry astral-sh's signed SLSA build provenance
      # before building on them — fail closed, so a PR that repins to an
      # unattested or tampered digest stops the build. Runs before the QEMU/
      # buildx setup to fail fast. Only the uv images are checkable here:
      # the python base is a Docker Official Image whose inline provenance is
      # unsigned (no verifiable signer). Refs are read from the Dockerfile so the
      # pins stay single-sourced.
      #
      # Comments are stripped before matching and every uv reference must be
      # digest-pinned. Scanning the raw file let a reference in a comment
      # satisfy the guard while the real FROM pointed elsewhere, and counting
      # any match let an unpinned `docker.io/astral/uv:latest` ride along
      # unverified beside a pinned one — the first needs a deliberate edit, the
      # second only a careless one. Both now fail the build.
      - name: Verify uv base image provenance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          refs=""
          count=0
          while IFS= read -r line; do
            # Drop comments before matching. A Dockerfile comment is a whole
            # line, so this empties those outright; anything after a '#' on an
            # instruction line is an argument Docker would reject, never a ref
            # worth verifying. Everything else is still scanned, so a uv image
            # pulled by COPY --from= or RUN --mount=,from= is covered too.
            line="${line%%#*}"
            case "$line" in
              *docker.io/astral/uv[:@]*) ;;
              *) continue ;;
            esac
            count=$((count + 1))
            # The tag is optional: `uv@sha256:...` is the strongest pin form.
            ref="$(printf '%s\n' "$line" |
              grep -oE 'docker\.io/astral/uv(:[^ @]+)?@sha256:[0-9a-f]{64}' || true)"
            if [ -z "$ref" ]; then
              echo "::error::uv image is not digest-pinned:$line"
              exit 1
            fi
            refs="$refs$ref"$'\n'
          done < Dockerfile
          if [ "$count" -eq 0 ]; then
            echo "::error::No uv image found in Dockerfile — verification would be a no-op"
            exit 1
          fi
          while IFS= read -r image; do
            [ -n "$image" ] || continue
            echo "::group::verify $image"
            gh attestation verify "oci://$image" \
              --owner astral-sh \
              --predicate-type https://slsa.dev/provenance/v1
            echo "::endgroup::"
          done < <(printf '%s' "$refs" | sort -u)

      - name: Docker meta
        id: docker-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ vars.DOCKERHUB_USERNAME }}/cf-ips-to-hcloud-fw
            quay.io/${{ vars.QUAY_USERNAME }}/cf-ips-to-hcloud-fw
            ghcr.io/${{ github.repository_owner }}/cf-ips-to-hcloud-fw
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest${{ github.event_name != 'pull_request' && github.actor != 'dependabot[bot]' && ',index' || '' }}

      # Scoped login (requires buildx >= 0.31, pinned below): credentials land
      # in the buildx-only config, not the default docker config, so the
      # runner's embedded pull token survives and base-image pulls during the
      # build stay rate-limit-free. Buildx uses these credentials solely to
      # push our repo.
      - name: Login to DockerHub (buildx push scope)
        if: ${{ github.event_name != 'pull_request' && github.actor != 'dependabot[bot]' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          scope: ${{ vars.DOCKERHUB_USERNAME }}/cf-ips-to-hcloud-fw@push

      - name: Login to Quay
        if: ${{ github.event_name != 'pull_request' && github.actor != 'dependabot[bot]' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: quay.io
          username: ${{ vars.QUAY_ROBOT }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Login to GitHub Container Registry
        if: ${{ github.event_name != 'pull_request' && github.actor != 'dependabot[bot]' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # QEMU/binfmt only emulates non-host architectures; skip it (and its Docker
      # Hub pull) unless we actually build multi-arch. Only PR and Dependabot
      # builds are single-arch amd64; main and tag pushes build (and publish)
      # amd64+arm64, matching the platforms expression on the build step below.
      - name: Set up QEMU
        if: ${{ github.event_name != 'pull_request' && github.actor != 'dependabot[bot]' }}
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          image: tonistiigi/binfmt:qemu-v10.2.3-68@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          # Pull the binfmt image fresh on tag builds: the gha image cache is
          # keyed by repo+tag only and docker-loads the tarball without checking
          # it against the digest pin above — only a real pull enforces the pin.
          # Keep the cache for main builds (branch-isolated scope, same trust
          # argument as the layer cache below).
          cache-image: ${{ !startsWith(github.ref, 'refs/tags/') }}

      # Release (tag) builds run cache-free for a hermetic commit→image chain,
      # mirroring the Python workflow. main/PR builds keep the gha cache for
      # speed: its scopes are branch-isolated (only code already on main can
      # write what a build restores) and a compromised main build publishes
      # images directly anyway, so the cache adds no new trust boundary.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0 # zizmor: ignore[cache-poisoning]
        with:
          driver-opts: image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
          version: v0.36.1
          # Fetch the buildx binary fresh from the pinned release on tag builds
          # instead of restoring it from the gha cache (hermetic; the binary is
          # the builder itself). Keep the cache for main/PR speed.
          cache-binary: ${{ !startsWith(github.ref, 'refs/tags/') }}

      # Timestamps come from the source commit, not the clock, so rebuilding a
      # given commit reproduces the same image. Read from the checkout above;
      # the default fetch-depth of 1 is enough for the tip commit's date.
      - name: Set SOURCE_DATE_EPOCH from the commit
        shell: bash
        run: |
          set -euo pipefail
          epoch="$(git log -1 --pretty=%ct)"
          if ! printf '%s' "$epoch" | grep -Eq '^[0-9]+$'; then
            echo "::error::Could not read a commit timestamp for SOURCE_DATE_EPOCH"
            exit 1
          fi
          echo "SOURCE_DATE_EPOCH=$epoch" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$epoch"

      - name: Build and push
        id: build-and-push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        env:
          SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}
        with:
          context: .
          platforms: ${{ github.event_name != 'pull_request' && github.actor != 'dependabot[bot]' && 'linux/amd64,linux/arm64' || '' }}
          # Spelled as `outputs` rather than push/load because rewrite-timestamp
          # is an image-exporter attribute and the `push` input cannot carry one.
          # SOURCE_DATE_EPOCH on its own only clamps the config, history and
          # index timestamps; rewrite-timestamp is what rewrites file mtimes
          # inside the layers, and without it the image is not reproducible.
          # `type=docker` is what `load: true` expands to, for the PR/Dependabot
          # path that builds without pushing.
          outputs: ${{ github.event_name != 'pull_request' && github.actor != 'dependabot[bot]' && 'type=image,push=true,rewrite-timestamp=true' || 'type=docker' }}
          sbom: ${{ github.event_name != 'pull_request' && github.actor != 'dependabot[bot]' && 'generator=docker/scout-sbom-indexer:1.24.0@sha256:4b67f29eb0d1244ab0f62de867ac5dafd7262fcd7ebbdefa6ec8aacd6b15252d' || '' }}
          provenance: ${{ github.event_name != 'pull_request' && github.actor != 'dependabot[bot]' && 'mode=max,version=v1' || '' }}
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}
          annotations: ${{ steps.docker-meta.outputs.annotations }}
          cache-from: ${{ !startsWith(github.ref, 'refs/tags/') && 'type=gha' || '' }}
          cache-to: ${{ !startsWith(github.ref, 'refs/tags/') && 'type=gha,mode=max' || '' }}
          # The gha cache keys a layer on its instruction and parent chain, so
          # the final stage's `apk upgrade` would replay from cache long after
          # Alpine moved on, and the `:main` image would ship stale packages.
          # Rebuild that stage every time; the builder stage (lint, tests,
          # wheel) stays cached. Tag builds run cache-free regardless.
          no-cache-filters: ${{ !startsWith(github.ref, 'refs/tags/') && 'final-image' || '' }}

      # No unscoped `docker login` after the build any more: the attestations
      # that needed one moved to the attest job below. Grype pulls the freshly
      # pushed image with the runner's embedded pull token, which is
      # rate-limit-free, and Scout takes its credentials as inputs (below).

      # Scout needs Docker Hub credentials for its API (organization + stream
      # compare), which the embedded pull token doesn't provide. Pass them as
      # inputs so the step works on non-fork PR builds too, where no docker
      # login has happened.
      - name: Analyze for critical and high CVEs with Docker Scout
        if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) && github.actor != 'dependabot[bot]' }}
        id: docker-scout-cves
        continue-on-error: true
        uses: docker/scout-action@7c6b6c3f7844478ace1ffd4e7aef649053d1f87d # v1.24.0
        with:
          dockerhub-user: ${{ vars.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}
          command: cves${{ !startsWith(github.ref, 'refs/tags/') && ',recommendations,compare' || '' }}
          image: ${{ vars.DOCKERHUB_USERNAME }}/cf-ips-to-hcloud-fw:${{ steps.docker-meta.outputs.version }}
          # Match Grype's only-fixed policy: report only actionable findings.
          # Unfixable base-image CVEs surface once a fix ships and are then
          # resolved by the next Renovate digest bump. Trade-off: disclosure of
          # an unfixed critical isn't flagged here until a fix exists.
          only-fixed: true
          sarif-file: sarif.output.json
          organization: ${{ vars.DOCKERHUB_USERNAME }}
          to: registry://${{ vars.DOCKERHUB_USERNAME }}/cf-ips-to-hcloud-fw:1

      - name: Upload Docker Scout scan result to GitHub Security tab
        if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) && github.actor != 'dependabot[bot]' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: sarif.output.json

      - name: Scan image with Grype
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        id: grype-scan
        continue-on-error: true
        with:
          image: ${{ vars.DOCKERHUB_USERNAME }}/cf-ips-to-hcloud-fw:${{ steps.docker-meta.outputs.version }}
          only-fixed: true
          add-cpes-if-none: true

      - name: Upload Grype scan result to GitHub Security tab
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        continue-on-error: true
        with:
          sarif_file: ${{ steps.grype-scan.outputs.sarif }}

  # Attestation runs in its own job so a transient Sigstore/GitHub failure can
  # be retried with "Re-run failed jobs" without re-running the build. That
  # matters because a rebuild can never reproduce the pushed digest: buildx
  # provenance (mode=max) carries a fresh `invocationId` and startedOn/
  # finishedOn per build, so the index digest changes even with an identical
  # context. A re-push would therefore retarget the release tags, and would be
  # rejected outright once Docker Hub's immutable tags are enabled for exact
  # versions.
  #
  # Don't try to fix this with SOURCE_DATE_EPOCH — it is deliberate upstream.
  # moby/buildkit#3421 asked for exactly that and was closed not_planned:
  # "there is no such thing as reproducible provenance ... the provenance is
  # for the actual invocation of the build request". A reproducible build is
  # meant to yield an identical in-toto *subject* (the per-platform image)
  # while each invocation's provenance legitimately differs — which is what
  # lets a third party rebuild and sign their own provenance over the same
  # subject. The index digest sits above both, so it inherits the variance.
  #
  # This job takes only the digest from `build`, so it never pushes an image;
  # it just attaches attestations to what is already published.
  attest:
    name: Attest
    needs: build
    # The event/actor guard mirrors the build job's push guard. The digest
    # check is what actually has to hold: PR and Dependabot builds use
    # `load:` instead of `push:`, so there is no pushed digest to attest and
    # `actions/attest` would fail obscurely on an empty subject-digest.
    if: ${{ github.event_name != 'pull_request' && github.actor != 'dependabot[bot]' && needs.build.outputs.digest != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          disable-sudo: true
          egress-policy: block
          # Sigstore (fulcio/rekor/timestamp/tuf) for signing, api.github.com
          # for the attestation store, and the three registries for pushing the
          # attestation as a referrer of the image digest. No layer pulls
          # happen here, so the registry CDNs the build job needs are absent.
          allowed-endpoints: >
            api.github.com:443
            auth.docker.io:443
            cdn01.quay.io:443
            cdn02.quay.io:443
            cdn03.quay.io:443
            fulcio.sigstore.dev:443
            ghcr.io:443
            github.com:443
            index.docker.io:443
            objects.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            production.cloudflare.docker.com:443
            quay.io:443
            registry-1.docker.io:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            timestamp.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443

      # Unlike the build job there is nothing here that benefits from the
      # runner's embedded pull token, so these logins are unscoped.
      - name: Login to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to Quay
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: quay.io
          username: ${{ vars.QUAY_ROBOT }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate artifact attestation for DockerHub
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: index.docker.io/${{ vars.DOCKERHUB_USERNAME }}/cf-ips-to-hcloud-fw
          subject-digest: ${{ needs.build.outputs.digest }}
          push-to-registry: true

      - name: Generate artifact attestation for Quay
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: quay.io/${{ vars.QUAY_USERNAME }}/cf-ips-to-hcloud-fw
          subject-digest: ${{ needs.build.outputs.digest }}
          push-to-registry: true

      - name: Generate artifact attestation for GitHub Container Registry
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/cf-ips-to-hcloud-fw
          subject-digest: ${{ needs.build.outputs.digest }}
          push-to-registry: true
