name: pre-commit hooks

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prek:
    name: Run pre-commit hooks
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          disable-sudo: true
          egress-policy: block
          # prek pulls hook environments: PyPI (python hooks + uv, pinned via
          # PREK_UV_SOURCE below), npm + nodejs (markdownlint), Go proxy + sumdb
          # storage (gitleaks, actionlint), GitHub, and the Go toolchain itself
          # (go.dev redirect -> dl.google.com tarball) — actionlint's go.mod
          # needs Go >= 1.25, newer than the runner's preinstalled Go, so prek
          # downloads a toolchain to build it from source.
          allowed-endpoints: >
            dl.google.com:443
            files.pythonhosted.org:443
            github.com:443
            go.dev:443
            nodejs.org:443
            proxy.golang.org:443
            pypi.org:443
            raw.githubusercontent.com:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            storage.googleapis.com:443

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run prek
        uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        env:
          # ruff/ty run via `make lint`; uv-lock needs uv and is covered by
          # Renovate lockfile maintenance plus the local hook.
          # Pin prek's internal uv source to PyPI (already allowlisted) so it
          # doesn't auto-probe mirrors — keeps egress deterministic under block.
          PREK_UV_SOURCE: pypi
          SKIP: ruff-check,ruff-format,ty,uv-lock
