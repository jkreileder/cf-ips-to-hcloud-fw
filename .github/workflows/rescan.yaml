name: Rescan released image

# The build-time scans in docker.yaml only see an image at release time; new
# advisories land against the released digest afterwards. Rescan the rolling
# major tag (:1, updated on every release) daily, and right after each
# release, with the same only-fixed policy and upload SARIF to the Security
# tab. Unlike the build-time scans this workflow gates nothing, so findings
# are allowed to fail the run — a red run is the notification that a fixable
# CVE affects the released image, and it starts auto-release.yaml.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"
  # After a release: the tag build of docker.yaml pushes the new :1, and this
  # rescan is what clears (or confirms) the findings recorded against the
  # previous one. Main builds complete the same workflow, so the job filters
  # on the run's ref below. The trigger reads nothing from the completed run
  # but its conclusion and ref.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows:
      - "Docker build, push, sign, and scan"
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  rescan:
    name: Rescan released image
    # From the workflow_run trigger, only after a successful tag build: a
    # push event from this repository whose head_branch is the tag name.
    # Main builds and failed runs leave :1 as it was, and a pull-request
    # build of the same workflow could carry any branch name.
    if: >-
      ${{ github.event_name != 'workflow_run'
      || (github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository
      && startsWith(github.event.workflow_run.head_branch, 'v')) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          disable-sudo: true
          egress-policy: block
          # Subset of the docker.yaml allowlist: Docker Hub pulls (including
          # the docker.io/library/python base image Scout fetches for its
          # base-image comparison), the Scout API/CLI and its two
          # d*.cloudfront.net vulnerability-data CDN distributions, the Grype
          # installer (raw.githubusercontent.com) and binary (GitHub releases)
          # and its DB, and the SARIF upload. If Docker or Anchore rotate
          # hosts, update the names from the harden-runner insights of the
          # failing run.
          allowed-endpoints: >
            api.dso.docker.com:443
            api.github.com:443
            api.scout.docker.com:443
            auth.docker.io:443
            d2glxqk2uabbnd.cloudfront.net:443
            d5l0dvt14r5h8.cloudfront.net:443
            docker-images-prod.6aa30f8b08e16409b46e0173d6de2f56.r2.cloudflarestorage.com:443
            docker-images-prod.s3.dualstack.us-east-1.amazonaws.com:443
            get.anchore.io:443
            github.com:443
            grype.anchore.io:443
            hub.docker.com:443
            index.docker.io:443
            objects.githubusercontent.com:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            raw.githubusercontent.com:443
            registry-1.docker.io:443
            registry.scout.docker.com:443
            release-assets.githubusercontent.com:443
            uploads.github.com:443

      # Grype auto-detects .grype.yaml in the workspace and Scout reads the VEX
      # statements in .vex/; without the checkout the rescan would ignore
      # fewer findings than the build-time scans.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Scout needs Docker Hub credentials for its API; no docker login has
      # happened in this workflow, so pass them as inputs (same pattern as
      # docker-build.yaml). This workflow only reads, so it gets the read-only
      # token. exit-code makes fixable findings fail the step.
      - name: Rescan with Docker Scout
        id: docker-scout-cves
        uses: docker/scout-action@e7e2a72bf1485d10a58f30696b6c513b261ce4fa # v1.29.0
        with:
          dockerhub-user: ${{ vars.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_READ_TOKEN }}
          command: cves
          image: registry://${{ vars.DOCKERHUB_USERNAME }}/cf-ips-to-hcloud-fw:1
          only-fixed: true
          exit-code: true
          # Same VEX statements as the build-time scan; see .vex/README.md.
          vex-location: .vex
          vex-author: <jk@blackdown.de>
          only-vex-affected: true
          sarif-file: sarif.output.json
          organization: ${{ vars.DOCKERHUB_USERNAME }}

      # Distinct SARIF categories keep these results separate from the
      # build-time scans, which upload under the default tool category.
      - name: Upload Docker Scout scan result to GitHub Security tab
        if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: sarif.output.json
          category: rescan-scout

      - name: Rescan with Grype
        if: ${{ !cancelled() }}
        id: grype-scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: docker.io/${{ vars.DOCKERHUB_USERNAME }}/cf-ips-to-hcloud-fw:1
          only-fixed: true
          add-cpes-if-none: true

      - name: Upload Grype scan result to GitHub Security tab
        if: ${{ !cancelled() && steps.grype-scan.outputs.sarif != '' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ steps.grype-scan.outputs.sarif }}
          category: rescan-grype
