name: TruffleHog secret scan

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:  # no base filter: stacked PRs target another PR's branch

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trufflehog:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            ghcr.io:443
            github.com:443
            pkg-containers.githubusercontent.com:443

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@20652fbbdefffcdaa493a5bf57ab2ac6b1db715b # v3.97.1
        with:
          path: .
          # `version` selects the scanner image and defaults to latest; the action pin
          # alone leaves it floating. Renovate bumps the version + digest.
          version: 3.97.4@sha256:562bc231afa9de3d04de44cfe624252b08207de1fc3cebc5e7ed92bed7f279e4
          # Lob excluded: the reordered-is-noop test name (tests/test_firewall.py) is
          # test_ + exactly 35 word chars, matching Lob's key pattern; TruffleHog verifies
          # it against Cloudflare-fronted api.lob.com, whose bot-block 403 the detector
          # reads as a successful verification.
          extra_args: --results=verified,unknown --exclude-detectors=lob
