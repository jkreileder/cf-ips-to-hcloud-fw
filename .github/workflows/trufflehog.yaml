name: TruffleHog secret scan

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:  # no base filter: stacked PRs target another PR's branch

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trufflehog:
    name: Secret scan
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            ghcr.io:443
            github.com:443
            pkg-containers.githubusercontent.com:443

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@ea68ca03c865c5f324e86e849ced20ed3cf9dbbb # v3.99.8
        with:
          path: .
          # `version` selects the scanner image and defaults to latest; the action pin
          # alone leaves it floating. Renovate bumps the version + digest.
          version: 3.99.8@sha256:674b2f187620a19df77f44cf9a7d77efcc581a5662accef2f2739cbb46ba4a3a
          # Lob excluded: the reordered-is-noop test name (tests/test_firewall.py) is
          # test_ + exactly 35 word chars, matching Lob's key pattern; TruffleHog verifies
          # it against Cloudflare-fronted api.lob.com, whose bot-block 403 the detector
          # reads as a successful verification.
          extra_args: --results=verified,unknown --exclude-detectors=lob
