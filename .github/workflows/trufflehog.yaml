name: TruffleHog secret scan

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:  # no base filter: stacked PRs target another PR's branch

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trufflehog:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            ghcr.io:443
            github.com:443
            pkg-containers.githubusercontent.com:443

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@bcfcf73aaf4759d4dadc2783177c245a02792318 # v3.97.0
        with:
          path: .
          # `version` selects the scanner image and defaults to latest; the action pin
          # alone leaves it floating. Renovate bumps the version + digest.
          version: 3.97.0@sha256:ff4c95e9df7d645daf2140e3ca1039031c63106268d5fbb25feb43ceca1bcc33
          # Lob excluded: the reordered-is-noop test name (tests/test_firewall.py) is
          # test_ + exactly 35 word chars, matching Lob's key pattern; TruffleHog verifies
          # it against Cloudflare-fronted api.lob.com, whose bot-block 403 the detector
          # reads as a successful verification.
          extra_args: --results=verified,unknown --exclude-detectors=lob
