name: Build, sign, and publish Python package

on:
  push:
    branches:
      - "main"
    tags:
      - "v*"
  pull_request:  # no base filter: stacked PRs target another PR's branch

permissions:
  contents: read

# Cancel superseded PR/branch runs, but never cancel tag runs (they publish).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            api.osv.dev:443
            files.pythonhosted.org:443
            github.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            releases.astral.sh:443

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }} and install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1 # zizmor: ignore[cache-poisoning]
        with:
          python-version: ${{ matrix.python-version }}
          version: "0.12.9"
          # No cache restore on tag runs so the release path can't be tainted
          # by a poisoned cache (cache-poisoning audit). zizmor cannot evaluate
          # the expression, hence the ignore on the step.
          enable-cache: ${{ !startsWith(github.ref, 'refs/tags/') }}

      # Scan the locked deps against OSV's malware advisories on every PR/push
      # sync. Kept off the hermetic release path (build-dist) on purpose so a
      # publish never depends on OSV availability.
      - name: Sync dependencies
        env:
          UV_MALWARE_CHECK: "1"
        run: uv sync --group dev --frozen --preview-features malware-check

      - name: Lint (ruff)
        run: uv run --no-sync ruff check --output-format=github

      - name: Format check (ruff)
        run: uv run --no-sync ruff format --check --output-format=github

      - name: Type check (ty)
        run: uv run --no-sync ty check --output-format=github

      - name: Test
        run: uv run --no-sync pytest

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.python-version }}
          path: test-results.xml
          retention-days: 14

      # Separate artifact from test-results-*: publish-test-results.yaml feeds
      # every XML in test-results-* to the JUnit publisher, which must not see
      # the Cobertura coverage report.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 14

  package-check:
    name: Package check
    # PR-only build/smoke feedback. main and tag pushes build the publishable
    # artifact once in build-dist, so this job stays read-only and never
    # uploads anything a downstream job could publish.
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            files.pythonhosted.org:443
            github.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            releases.astral.sh:443

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python and install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.11"
          version: "0.12.9"
          # PR-only feedback build: caching disabled. It gains little for a
          # single build and keeps this job off the cache-poisoning surface.
          enable-cache: false

      - name: Build
        run: |
          rm -rf dist
          uv build

      - name: Smoke test built wheel
        run: |
          uv run --isolated --no-project --with dist/*.whl \
            cf-ips-to-hcloud-fw --version

  upload-to-codecov:
    name: Upload to Codecov
    # Codecov uploads run in their own job so the third-party uploader only
    # ever sees the coverage/test-result XML files — never the workspace of
    # the jobs that build and attest release artifacts — and its egress
    # (including the shared storage.googleapis.com host) stays out of the
    # test job's allowlist. Runs even when the test job failed so a red
    # test run still reports its results.
    if: ${{ !cancelled() }}
    needs:
      - test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.codecov.io:443
            api.github.com:443
            cli.codecov.io:443
            codecov.io:443
            github.com:443
            ingest.codecov.io:443
            keybase.io:443
            o26192.ingest.us.sentry.io:443
            storage.googleapis.com:443
            uploader.codecov.io:443

      # The codecov CLI fixes report paths against the source tree.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # continue-on-error: the artifacts don't exist when the build job died
      # before pytest (lint/type-check failure); the codecov steps then warn
      # about the missing files instead of failing, as they did in-job.
      - name: Download test results
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: test-results-${{ matrix.python-version }}

      - name: Download coverage report
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-${{ matrix.python-version }}

      - name: Upload test results to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./test-results.xml
          flags: python-${{ matrix.python-version }}
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage report to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage.xml
          flags: python-${{ matrix.python-version }}
          token: ${{ secrets.CODECOV_TOKEN }}

  check-release-version:
    name: Check release version
    # Runs on every non-PR push. On a tag it verifies the tag matches
    # pyproject.toml and refuses non-final (.dev/pre-release/local) versions; on
    # main it is a deliberate no-op pass. It can't be tag-only: build-dist
    # depends on it and must also run on main (to attest main builds), and a
    # skipped tag-only check would skip build-dist on main too. Gating build-dist
    # here fails a mistaken tag before anything is built or reaches PyPI
    # (irreversible), while main still proceeds to build and attestation.
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify tag matches project version
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/tags/*) ;;
            *)
              echo "Not a tag push (ref: $GITHUB_REF); release-version check not applicable."
              exit 0
              ;;
          esac
          version="$(sed -nE 's/^version = "([^"]+)"$/\1/p' pyproject.toml)"
          if [ -z "$version" ]; then
            echo "::error::Could not read version from pyproject.toml"
            exit 1
          fi
          expected="${TAG#v}"
          if [ "$version" != "$expected" ]; then
            echo "::error::Tag $TAG (version '$expected') does not match pyproject.toml version '$version'"
            exit 1
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Refusing to publish non-final version '$version' from tag $TAG"
            exit 1
          fi
          echo "Release version '$version' matches tag $TAG"

  build-and-attest-dist:
    name: Build and attest distribution
    # Build and attestation run together inside a reusable workflow so the
    # GitHub artifact attestations qualify for SLSA Build Level 3 — the signed
    # provenance records that workflow file as the signer (see the header of
    # build-and-attest-dist.yaml). Runs once per non-PR push (main and tags),
    # gated on the full test matrix so a tag with failing tests never builds
    # or publishes, and on check-release-version so a mistaken tag fails
    # before anything is built (on main that check is a no-op pass).
    if: ${{ github.event_name != 'pull_request' }}
    needs:
      - test
      - check-release-version
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: $/.github/workflows/build-and-attest-dist.yaml

  draft-release:
    name: Create draft release
    # Replaces the retired slsa-github-generator call (the project is no longer
    # maintained): build provenance comes from the GitHub artifact attestations
    # that build-and-attest-dist publishes for every artifact (verified with
    # `gh attestation verify`, see README.md), so this job only creates the
    # draft release that the publish chain and upload-dist-to-github-release
    # depend on. It never checks out or runs repository code.
    if: ${{ github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/') }}
    needs:
      - build-and-attest-dist
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            uploads.github.com:443

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --json isDraft --jq .isDraft >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi
          gh release create "$TAG" --draft --title "$TAG" --verify-tag --notes ""

  publish-to-test-pypi:
    name: Publish to TestPyPI
    if: ${{ github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/') }}
    needs:
      - draft-release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: test-pypi
      url: https://test.pypi.org/p/cf-ips-to-hcloud-fw
    permissions:
      id-token: write

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            fulcio.sigstore.dev:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            rekor.sigstore.dev:443
            test.pypi.org:443
            tuf-repo-cdn.sigstore.dev:443

      - name: Download all the distribution packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist

      - name: Publish distribution to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-to-pypi:
    name: Publish to PyPI
    if: ${{ github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/') }}
    needs:
      - draft-release
      - publish-to-test-pypi
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/cf-ips-to-hcloud-fw
    permissions:
      id-token: write

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            fulcio.sigstore.dev:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            upload.pypi.org:443

      - name: Download all the distribution packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  upload-dist-to-github-release:
    name: Upload distribution packages to GitHub Release
    if: ${{ github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/') }}
    needs:
      - publish-to-pypi
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            uploads.github.com:443

      - name: Download all the distribution packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist

      # Signed provenance/SBOM bundles for the artifacts below, so they can be
      # verified without querying GitHub's attestation API. See the assembly
      # step in build-and-attest-dist.yaml.
      - name: Download the attestation bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: attestation-bundle
          path: attestation

      - name: Upload distribution packages to GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: >-
          gh release upload
          "$TAG" dist/** attestation/multiple.intoto.jsonl
          --repo '${{ github.repository }}'
