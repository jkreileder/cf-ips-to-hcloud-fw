name: Build, sign, and publish Python package

on:
  push:
    branches:
      - "main"
    tags:
      - "v*"
  pull_request:
    branches:
      - "main"

permissions:
  contents: read

# Cancel superseded PR/branch runs, but never cancel tag runs (they publish).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  upload-event-file:
    name: Upload event file
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          disable-sudo: true
          egress-policy: block

      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: event-file
          path: ${{ github.event_path }}
          retention-days: 5

  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            api.osv.dev:443
            files.pythonhosted.org:443
            github.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            releases.astral.sh:443

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }} and install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          version: "0.12.1"
          # No cache restore on tag runs so the release path can't be tainted
          # by a poisoned cache (cache-poisoning audit).
          enable-cache: ${{ !startsWith(github.ref, 'refs/tags/') }}

      # Scan the locked deps against OSV's malware advisories on every PR/push
      # sync. Kept off the hermetic release path (build-dist) on purpose so a
      # publish never depends on OSV availability.
      - name: Sync dependencies
        env:
          UV_MALWARE_CHECK: "1"
        run: uv sync --group dev --frozen --preview-features malware-check

      - name: Lint (ruff)
        run: uv run --no-sync ruff check --output-format=github

      - name: Format check (ruff)
        run: uv run --no-sync ruff format --check --output-format=github

      - name: Type check (ty)
        run: uv run --no-sync ty check --output-format=github

      - name: Test
        run: uv run --no-sync pytest

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.python-version }}
          path: test-results.xml
          retention-days: 14

      # Separate artifact from test-results-*: publish-test-results.yaml feeds
      # every XML in test-results-* to the JUnit publisher, which must not see
      # the Cobertura coverage report.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 14

  package-check:
    name: Package check
    # PR-only build/smoke feedback. main and tag pushes build the publishable
    # artifact once in build-dist, so this job stays read-only and never
    # uploads anything a downstream job could publish.
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            files.pythonhosted.org:443
            github.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            releases.astral.sh:443

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python and install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.11"
          version: "0.12.1"
          # PR-only feedback build: caching disabled. It gains little for a
          # single build and keeps this job off the cache-poisoning surface.
          enable-cache: false

      - name: Build
        run: |
          rm -rf dist
          uv build

      - name: Smoke test built wheel
        run: |
          uv run --isolated --no-project --with dist/*.whl \
            cf-ips-to-hcloud-fw --version

  upload-to-codecov:
    name: Upload to Codecov
    # Codecov uploads run in their own job so the third-party uploader only
    # ever sees the coverage/test-result XML files — never the workspace of
    # the jobs that build and attest release artifacts — and its egress
    # (including the shared storage.googleapis.com host) stays out of the
    # test job's allowlist. Runs even when the test job failed so a red
    # test run still reports its results.
    if: ${{ !cancelled() }}
    needs:
      - test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.codecov.io:443
            api.github.com:443
            cli.codecov.io:443
            codecov.io:443
            github.com:443
            ingest.codecov.io:443
            keybase.io:443
            o26192.ingest.us.sentry.io:443
            storage.googleapis.com:443
            uploader.codecov.io:443

      # The codecov CLI fixes report paths against the source tree.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # continue-on-error: the artifacts don't exist when the build job died
      # before pytest (lint/type-check failure); the codecov steps then warn
      # about the missing files instead of failing, as they did in-job.
      - name: Download test results
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: test-results-${{ matrix.python-version }}

      - name: Download coverage report
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-${{ matrix.python-version }}

      - name: Upload test results to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./test-results.xml
          flags: python-${{ matrix.python-version }}
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage report to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage.xml
          flags: python-${{ matrix.python-version }}
          token: ${{ secrets.CODECOV_TOKEN }}

  check-release-version:
    name: Check release version
    # Runs on every non-PR push. On a tag it verifies the tag matches
    # pyproject.toml and refuses non-final (.dev/pre-release/local) versions; on
    # main it is a deliberate no-op pass. It can't be tag-only: build-dist
    # depends on it and must also run on main (to attest main builds), and a
    # skipped tag-only check would skip build-dist on main too. Gating build-dist
    # here fails a mistaken tag before anything is built or reaches PyPI
    # (irreversible), while main still proceeds to build and attestation.
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify tag matches project version
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/tags/*) ;;
            *)
              echo "Not a tag push (ref: $GITHUB_REF); release-version check not applicable."
              exit 0
              ;;
          esac
          version="$(sed -nE 's/^version = "([^"]+)"$/\1/p' pyproject.toml)"
          if [ -z "$version" ]; then
            echo "::error::Could not read version from pyproject.toml"
            exit 1
          fi
          expected="${TAG#v}"
          if [ "$version" != "$expected" ]; then
            echo "::error::Tag $TAG (version '$expected') does not match pyproject.toml version '$version'"
            exit 1
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Refusing to publish non-final version '$version' from tag $TAG"
            exit 1
          fi
          echo "Release version '$version' matches tag $TAG"

  build-dist:
    name: Build distribution
    # Build the publishable sdist/wheel once per non-PR push (main and tags),
    # read-only. Gated on the full test matrix so a tag with failing tests never
    # builds or publishes, and on check-release-version so a mistaken tag fails
    # before anything is built (on main that check is a no-op pass). The
    # privileged attestation happens in attest-dist, which only downloads these
    # artifacts.
    if: ${{ github.event_name != 'pull_request' }}
    needs:
      - test
      - check-release-version
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            files.pythonhosted.org:443
            get.anchore.io:443
            github.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            releases.astral.sh:443

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python and install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.11"
          version: "0.12.1"
          # Keep the published artifacts hermetic: never restore caches here.
          enable-cache: false

      - name: Build
        run: |
          rm -rf dist
          uv build

      - name: Smoke test built wheel
        run: |
          uv run --isolated --no-project --with dist/*.whl \
            cf-ips-to-hcloud-fw --version

      # Write the SBOM to the repo root only; attest-dist re-uploads it under a
      # name we control (below), so we upload once, explicitly, with the same
      # pinned action as everything else instead of relying on sbom-action's
      # internal artifact naming.
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          format: spdx-json
          output-file: sbom-python.spdx.json
          upload-artifact: false

      - name: Store the SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-python.spdx.json
          path: sbom-python.spdx.json
          retention-days: 14

      # Hash only the distributions. The SBOM is written to the repo root (not
      # into dist/), so the SLSA subjects cover exactly the wheel and sdist.
      - name: Generate hashes
        id: hash
        run: cd dist && echo "hashes=$(sha256sum -- * | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Store the distribution packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          retention-days: 14

  attest-dist:
    name: Attest distribution
    # Minimal privileged job: it only downloads the already-built distribution
    # and SBOM and attests them. It never checks out or runs repository code, so
    # id-token/attestations write never touches a build step. The dependabot
    # guard mirrors the original attestation steps and the repo's policy of not
    # running privileged jobs as dependabot; these triggers (push to main / v*
    # tags) don't fire for dependabot, so it is defensive only.
    if: ${{ github.event_name != 'pull_request' && github.actor != 'dependabot[bot]' }}
    needs:
      - build-dist
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            fulcio.sigstore.dev:443
            github.com:443
            objects.githubusercontent.com:443
            rekor.sigstore.dev:443
            uploads.github.com:443

      - name: Download the distribution packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist

      - name: Download the SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom-python.spdx.json
          path: sbom

      - name: Generate SBOM attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
          sbom-path: sbom/sbom-python.spdx.json

      - name: Generate artifact attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

  provenance-and-draft-release:
    name: Generate provenance and create draft release
    if: ${{ github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/') }}
    needs:
      - build-dist
      - attest-dist
      - upload-event-file
    permissions:
      actions: read
      id-token: write
      contents: write
    # Can't pin with hash: SLSA verification requires calling the generator
    # by tag, and GitHub evaluates the ref for nested actions inside it too.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0 # zizmor: ignore[unpinned-uses]
    with:
      base64-subjects: ${{ needs.build-dist.outputs.hashes }}
      upload-assets: true
      draft-release: true

  publish-to-test-pypi:
    name: Publish to TestPyPI
    if: ${{ github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/') }}
    needs:
      - provenance-and-draft-release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: test-pypi
      url: https://test.pypi.org/p/cf-ips-to-hcloud-fw
    permissions:
      id-token: write

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            fulcio.sigstore.dev:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            rekor.sigstore.dev:443
            test.pypi.org:443
            tuf-repo-cdn.sigstore.dev:443

      - name: Download all the distribution packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist

      - name: Publish distribution to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-to-pypi:
    name: Publish to PyPI
    if: ${{ github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/') }}
    needs:
      - provenance-and-draft-release
      - publish-to-test-pypi
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/cf-ips-to-hcloud-fw
    permissions:
      id-token: write

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            fulcio.sigstore.dev:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            upload.pypi.org:443

      - name: Download all the distribution packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  upload-dist-to-github-release:
    name: Upload distribution packages to GitHub Release
    if: ${{ github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/') }}
    needs:
      - publish-to-pypi
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            uploads.github.com:443

      - name: Download all the distribution packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist

      - name: Upload distribution packages to GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: >-
          gh release upload
          "$TAG" dist/**
          --repo '${{ github.repository }}'
