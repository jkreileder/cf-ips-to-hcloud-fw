name: Build and attest distribution

# Reusable build + attest path for the Python wheel and sdist. The build and
# the attestation generation live together in this reusable workflow so the
# GitHub artifact attestations qualify for SLSA Build Level 3: the signed
# provenance records this workflow file as the signer (its job_workflow_ref),
# which the calling workflow cannot influence beyond invoking it. Verifiers
# can require it:
#
#   gh attestation verify <artifact> --repo jkreileder/cf-ips-to-hcloud-fw \
#     --signer-workflow jkreileder/cf-ips-to-hcloud-fw/.github/workflows/build-and-attest-dist.yaml
#
# Event gating (non-PR push) and the test/version-check ordering live in the
# calling workflow (python-package.yaml).

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build-dist:
    name: Build distribution
    # Builds the publishable sdist/wheel, read-only. The privileged attestation
    # happens in attest-dist, which only downloads these artifacts.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            files.pythonhosted.org:443
            get.anchore.io:443
            github.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            releases.astral.sh:443

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python and install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.11"
          version: "0.12.5"
          # Keep the published artifacts hermetic: never restore caches here.
          enable-cache: false

      - name: Build
        run: |
          rm -rf dist
          uv build

      - name: Smoke test built wheel
        run: |
          uv run --isolated --no-project --with dist/*.whl \
            cf-ips-to-hcloud-fw --version

      # Write the SBOM to the repo root only; attest-dist re-uploads it under a
      # name we control (below), so we upload once, explicitly, with the same
      # pinned action as everything else instead of relying on sbom-action's
      # internal artifact naming.
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          format: spdx-json
          output-file: sbom-python.spdx.json
          upload-artifact: false

      - name: Store the SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-python.spdx.json
          path: sbom-python.spdx.json
          retention-days: 14

      - name: Store the distribution packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          retention-days: 14

  attest-dist:
    name: Attest distribution
    # Minimal privileged job: it only downloads the already-built distribution
    # and SBOM and attests them. It never checks out or runs repository code, so
    # id-token/attestations write never touches a build step. The dependabot
    # guard mirrors the original attestation steps and the repo's policy of not
    # running privileged jobs as dependabot; the calling workflow's triggers
    # (push to main / v* tags) don't fire for dependabot, so it is defensive
    # only.
    if: ${{ github.actor != 'dependabot[bot]' }}
    needs:
      - build-dist
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            fulcio.sigstore.dev:443
            github.com:443
            objects.githubusercontent.com:443
            rekor.sigstore.dev:443
            uploads.github.com:443

      - name: Download the distribution packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist

      - name: Download the SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom-python.spdx.json
          path: sbom

      - name: Generate SBOM attestation
        id: attest-sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
          sbom-path: sbom/sbom-python.spdx.json

      - name: Generate artifact attestation
        id: attest-provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

      # The attestations above live in GitHub's attestation API, which needs
      # network access to query. Ship the signed bundles as a release asset too
      # so the artifacts can be verified offline (`gh attestation verify
      # --bundle`, see README.md) — and so OpenSSF Scorecard's Signed-Releases
      # check can see the provenance, which it only detects via the
      # `.intoto.jsonl` asset name (ossf/scorecard#4667).
      #
      # actions/attest writes one Sigstore bundle per `bundle-path` file, so
      # `jq -c .` yields the same JSON-lines-of-Sigstore-bundles file (and name)
      # slsa-github-generator published up to v1.3.1.
      #
      # The assertion guards against a future actions/attest release changing
      # that layout: Scorecard accepts the asset on its name alone, so a
      # malformed bundle would ship silently and only break the documented
      # `gh attestation verify --bundle` path.
      - name: Assemble the attestation bundle
        env:
          SBOM_BUNDLE: ${{ steps.attest-sbom.outputs.bundle-path }}
          PROVENANCE_BUNDLE: ${{ steps.attest-provenance.outputs.bundle-path }}
        run: |
          jq -c . "$PROVENANCE_BUNDLE" "$SBOM_BUNDLE" > multiple.intoto.jsonl
          jq -se 'length == 2
            and all(.[]; .mediaType
              | startswith("application/vnd.dev.sigstore.bundle"))' \
            multiple.intoto.jsonl > /dev/null

      - name: Store the attestation bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: attestation-bundle
          path: multiple.intoto.jsonl
          retention-days: 14
