# Grype configuration for the container image scans. Every Grype run in CI
# starts from a checkout of this repository (docker-build.yaml, rescan.yaml,
# auto-release.yaml, auto-release-publish.yaml), and Grype picks this file up
# from the working directory, so a rule here applies to all of them: the
# build-time gate, the daily rescan, the auto-release plan and the release
# verification. That reach is why the file exists even while it is empty:
# a suppression is a reviewed change to a tracked file, not a file that
# appears one day and is read without anyone noticing.
#
# A suppression names an exact package version and records why it is a false
# positive and when to remove it, and issue #1584 lists it. .vex/README.md
# holds the same rules for Docker Scout.
ignore: []
