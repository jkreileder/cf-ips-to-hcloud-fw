# Grype ignore rules — every entry MUST state its removal condition.
#
# Tracking issue for clearing this list: #1412. Do not let entries outlive
# their condition.
ignore:
  # poplib: newline injection through user-controlled commands. Fixed in
  # 3.15.0 (python/cpython#143924 is in the v3.15.0 tag), but NVD's bound is
  # `< 3.15.0a6` and grype compares CPython CPE versions with a generic
  # ordering that puts the 3.15.0 final release before 3.15.0a6. Scoped to
  # 3.15.0: a later 3.15.x sorts after the bound and is scanned normally.
  # REMOVE when CI's grype carries anchore/grype#3776 (PEP 440 ordering for
  # CPython CPEs), or when the base image moves past python 3.15.0.
  - vulnerability: CVE-2025-15367
    package:
      name: python
      version: 3.15.0
      type: binary
