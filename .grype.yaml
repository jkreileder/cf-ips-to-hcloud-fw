# Grype ignore rules — every entry MUST state its removal condition.
#
# Tracking issue for clearing this list: #1584. Do not let entries outlive
# their condition.
ignore:
  # socket: getaddrinfo() accepts null bytes in host and port and silently
  # truncates them (CVE-2026-116566, medium). The fix is only on main
  # (python/cpython#160899); the 3.15 backport (python/cpython#160925) is
  # open, so no 3.15.x release carries it yet and grype's only listed fix is
  # 3.16.0. Pinned to the interpreter version in the base image: the next
  # Python patch bump either carries the backport and this entry goes, or it
  # does not and the pin has to move along with it.
  # REMOVE when the base image reaches a 3.15.x release that includes
  # python/cpython#160925.
  - vulnerability: CVE-2026-116566
    package:
      name: python
      version: 3.15.2
      type: binary
